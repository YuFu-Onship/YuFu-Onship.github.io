<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Doc Reader</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --amber: #d4a35e;
            --amber-bright: #f0c987;
            --amber-dim: #5e4a2d;
            --bg: #1a1815;
            --ui-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            --code-font: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--amber);
            font-family: var(--ui-font);
            overflow: hidden;
        }

        /* ===== Layout ===== */
        #app {
            display: flex;
            height: 100vh;
            border: 1px solid var(--amber-dim);
        }

        #sidebar {
            width: 280px;
            transition: width .4s cubic-bezier(.16, 1, .3, 1);
            border-right: 1px solid var(--amber-dim);
            background: rgba(0, 0, 0, .15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            width: 60px;
        }

        /* ===== Sidebar Buttons ===== */
        #home-btn {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-bottom: 1px solid var(--amber-dim);
            transition: all 0.3s;
            letter-spacing: 4px;
            flex-shrink: 0;
        }

        #home-btn:hover {
            background: var(--amber-dim);
            color: var(--bg);
        }

        #sidebar.collapsed #home-btn::after {
            content: "";
            width: 12px;
            height: 12px;
            background: var(--amber);
            border-radius: 100%;
            box-shadow: 0 0 8px var(--amber);
        }

        #sidebar.collapsed #home-btn span {
            display: none;
        }

        #toggle-btn {
            padding: 18px 0;
            text-align: center;
            cursor: pointer;
            border-bottom: 1px solid var(--amber-dim);
            font-weight: bold;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        #toggle-btn:hover {
            background: var(--amber-dim);
            color: var(--bg);
        }

        #sidebar.collapsed .nav-item,
        #sidebar.collapsed #toggle-btn span {
            opacity: 0;
            pointer-events: none;
        }

        #nav-list {
            list-style: none;
            padding: 12px 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1.05em;
            white-space: nowrap;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(212, 163, 94, 0.1);
        }

        .nav-item.active {
            background: var(--amber);
            color: var(--bg);
            font-weight: bold;
            border-left: 3px solid var(--amber-bright);
        }

        /* ===== Main ===== */
        #main {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            /* 关键：设置为 auto，避免 smooth 导致的自动定位问题 */
            scroll-behavior: auto; 
            position: relative;
        }

        #meta {
            font-size: .85em;
            opacity: .7;
            /* 移除原有的 border-bottom，由进度条代替 */
            padding-bottom: 10px;
            margin-bottom: 0; 
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        /* ===== 进度条与分割线融合 ===== */
        #progress-track {
            width: 100%;
            height: 1px; /* 分割线的高度 */
            background: var(--amber-dim); /* 未加载部分的颜色（暗色分割线） */
            margin-bottom: 30px;
            position: relative;
        }

        #progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%; /* 动态控制 */
            background: var(--amber-bright); /* 加载部分的颜色（亮色） */
            box-shadow: 0 0 10px var(--amber); /* 发光效果 */
            transition: width 0.1s linear;
        }

        #content {
            max-width: 820px;
            font-size: 1.2rem;
            line-height: 1.4;
        }

        pre code[class*="language-"] {
            font-size: 1rem;
            line-height: 1.1;
        }

        /* ===== Typing cursor ===== */
        .typing::after {
            content: "▊";
            margin-left: 4px;
            animation: blink .8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== Home View ===== */
        .home {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: left;
        }

        .home-time {
            font-size: 5rem;
            letter-spacing: 4px;
        }

        .home-date {
            font-size: 1.2rem;
            opacity: .6;
        }

        /* ===== Markdown Elements ===== */
        #content h1, #content h2, #content h3 {
            color: var(--amber-bright);
            margin: 1.5em 0 0.8em;
        }

        pre {
            background: #12100d;
            padding: 16px;
            border-left: 4px solid var(--amber);
            overflow-x: auto;
        }

        code {
            font-family: var(--code-font);
            color: var(--amber-bright);
        }

        p code {
            background: #2a2217;
            padding: 2px 6px;
            border-radius: 4px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--amber-dim);
        }
    </style>
</head>

<body>
    <div id="app">

        <aside id="sidebar">
            <div id="home-btn" onclick="showHome()">
                <span>HOME</span>
            </div>
            <div id="toggle-btn" onclick="toggleSidebar()">
                <span>[ 目录 ]</span>
            </div>
            <ul id="nav-list">
                <li class="nav-item">Loading index...</li>
            </ul>
        </aside>

        <main id="main">
            <div id="meta">
                <span id="meta-info">SYSTEM READY</span>
                <span id="meta-file"></span>
            </div>
            
            <div id="progress-track">
                <div id="progress-bar"></div>
            </div>

            <article id="content"></article>
        </main>

    </div>

    <script>
        const content = document.getElementById("content");
        const metaInfo = document.getElementById("meta-info");
        const metaFile = document.getElementById("meta-file");
        const progressBar = document.getElementById("progress-bar");
        
        let collapsed = false;
        let clockTimer = null;
        let typingTimer = null;
        let isTyping = false; // 控制打字状态

        /* ===== 侧边栏折叠 ===== */
        function toggleSidebar() {
            const sb = document.getElementById("sidebar");
            const btnText = document.querySelector("#toggle-btn span");
            collapsed = !collapsed;
            sb.classList.toggle("collapsed", collapsed);
            btnText.innerText = collapsed ? ">" : "[ 目录 ]";
        }

        /* ===== 主页显示 ===== */
        function showHome() {
            stopTyping();
            clearActiveStatus();
            clearInterval(clockTimer);

            content.classList.remove("typing");
            metaInfo.innerText = "SYSTEM IDLE";
            metaFile.innerText = "";
            progressBar.style.width = "0%"; // 回到主页重置进度条

            content.innerHTML = `
        <div class="home">
            <div class="home-time" id="clock">--:--:--</div>
            <div class="home-date" id="date"></div>
        </div>`;

            updateClock();
            clockTimer = setInterval(updateClock, 1000);
        }

        function updateClock() {
            const clockEl = document.getElementById("clock");
            if (!clockEl) return;
            const n = new Date();
            clockEl.innerText = n.toLocaleTimeString("en-GB");
            document.getElementById("date").innerText = n.toDateString();
        }

        /* ===== 加载索引 ===== */
        async function loadIndex() {
            try {
                const r = await fetch("index.json");
                const list = await r.json();
                const nav = document.getElementById("nav-list");
                nav.innerHTML = "";

                list.forEach((a, index) => {
                    const li = document.createElement("li");
                    li.className = "nav-item";
                    li.id = "nav-item-" + index;
                    li.innerText = "> " + a.title;
                    li.onclick = () => {
                        clearActiveStatus();
                        li.classList.add("active");
                        loadArticle(a);
                    };
                    nav.appendChild(li);
                });
            } catch (e) {
                document.getElementById("nav-list").innerHTML = "<li class='nav-item'>INDEX LOAD ERROR</li>";
            }
        }

        function clearActiveStatus() {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        }

        /* ===== 加载文章内容 ===== */
        async function loadArticle(a) {
            stopTyping();
            clearInterval(clockTimer);

            // 重置滚动条到顶部
            document.getElementById("main").scrollTop = 0;

            // 重置进度条
            progressBar.style.width = "0%";

            metaInfo.innerText = `AUTH: ${a.author} | DATE: ${a.date}`;
            metaFile.innerText = `FILE: ${a.path}`;

            content.innerHTML = "";
            
            try {
                const r = await fetch(a.path);
                const md = await r.text();
                const html = marked.parse(md);
                typeHTML(html);
            } catch {
                content.innerText = "FILE NOT FOUND: " + a.path;
                content.classList.remove("typing");
            }
        }

        function stopTyping() {
            isTyping = false;
            // 清理可能存在的定时器
            if (typingTimer) {
                clearInterval(typingTimer);
                typingTimer = null;
            }
        }

        /* ===== 打字机逻辑 ===== */
        async function typeHTML(html) {
            isTyping = true;
            content.classList.add("typing");

            const temp = document.createElement("div");
            temp.innerHTML = html;
            const nodes = Array.from(temp.childNodes);
            const totalNodes = nodes.length;

            for (let i = 0; i < nodes.length; i++) {
                if (!isTyping) break;

                const node = nodes[i];
                
                // 更新进度条 ( +1 确保最后能到 100% )
                const progress = ((i + 1) / totalNodes) * 100;
                progressBar.style.width = progress + "%";

                // 创建容器
                const container = node.cloneNode(false);
                content.appendChild(container);

                if (node.nodeType === Node.TEXT_NODE) {
                    await typeText(node.textContent, container);
                } else {
                    // 非文本节点（标签）
                    container.innerHTML = node.innerHTML;

                    // LaTeX 渲染
                    if (window.renderMathInElement) {
                        renderMathInElement(container, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    }

                    // 代码块高亮标签
                    handleCodeLabels(container);

                    // 稍微停顿，模拟处理
                    await new Promise(r => setTimeout(r, 80));
                }
            }

            content.classList.remove("typing");
            isTyping = false;
        }

        // 逐字显示文本
        function typeText(text, target) {
            return new Promise(resolve => {
                let i = 0;
                // 使用 setInterval 模拟打字
                const interval = setInterval(() => {
                    // 如果中途切换文章，停止当前循环
                    if (!isTyping) {
                        clearInterval(interval);
                        resolve();
                        return;
                    }

                    target.textContent += text[i++];
                    // 注意：此处移除了所有自动滚动的代码

                    if (i >= text.length) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 5); // 5ms 极速打字，如果觉得太快可改为 10 或 20
            });
        }

        // 代码块标签处理
        function handleCodeLabels(container) {
            const codeBlocks = container.querySelectorAll('pre code');
            codeBlocks.forEach(code => {
                const className = code.className;
                if (className.startsWith('language-')) {
                    const lang = className.replace('language-', '').toUpperCase();
                    const label = document.createElement('div');
                    label.innerText = lang;
                    Object.assign(label.style, {
                        position: 'absolute', top: '5px', right: '10px',
                        fontSize: '0.8rem', color: 'var(--amber)', opacity: '0.5'
                    });
                    code.parentElement.style.position = 'relative';
                    code.parentElement.appendChild(label);
                }
            });
        }

        /* ===== 初始化 ===== */
        showHome();
        loadIndex();
    </script>
</body>

</html>
