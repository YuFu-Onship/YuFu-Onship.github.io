<!doctype html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YuFu-Onship</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        ></script>

        <style>
            /* ============================================================
               WINUI 3 DESIGN TOKENS
               ============================================================ */
            :root {
                /* --- Light Theme --- */
                --winui-pane-bg:            #F3F3F3;
                --winui-pane-hover:         #E6E6E6;
                --winui-pane-active:        #E0E0E0;
                --winui-content-bg:         #FFFFFF;
                --winui-page-bg:            #F0F0F0;

                --winui-text-primary:       #1B1B1B;
                --winui-text-secondary:     #616161;
                --winui-text-tertiary:      #8A8A8A;

                --winui-accent:             #0078D4;
                --winui-accent-hover:       #106EBE;
                --winui-accent-light:       rgba(0, 120, 212, 0.09);
                --winui-accent-subtle:      rgba(0, 120, 212, 0.06);

                --winui-warning:            #FFB900;
                --winui-stroke:             #E1E1E1;
                --winui-stroke-strong:      #C8C8C8;
                --winui-stroke-focus:       #0078D4;

                --winui-shadow-1: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
                --winui-shadow-2: 0 4px 8px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
                --winui-shadow-4: 0 8px 16px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.06);

                --winui-font-ui:   "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
                --winui-font-code: "Cascadia Code", "JetBrains Mono", "Fira Code", "Consolas", monospace;

                --winui-radius-1:  3px;
                --winui-radius-2:  6px;
                --winui-radius-3:  8px;
                --winui-radius-4:  12px;

                --winui-ease:       cubic-bezier(0.33, 0.00, 0.10, 1.00);
                --winui-duration-1: 100ms;
                --winui-duration-2: 200ms;
                --winui-duration-3: 300ms;
                --winui-duration-4: 400ms;

                --sidebar-width:      280px;
                --sidebar-collapsed:  52px;

                /* Back compat — JS uses these */
                --bg-primary:     var(--winui-page-bg);
                --bg-card:        var(--winui-content-bg);
                --text-primary:   var(--winui-text-primary);
                --text-secondary: var(--winui-text-secondary);
                --accent:         var(--winui-accent);
                --gold:           var(--winui-warning);
                --line:           var(--winui-stroke);
                --ui-font:        var(--winui-font-ui);
                --code-font:      var(--winui-font-code);

                color-scheme: light;
            }

            /* --- Dark Theme --- */
            [data-theme="dark"] {
                --winui-pane-bg:            #202020;
                --winui-pane-hover:         #2D2D2D;
                --winui-pane-active:        #333333;
                --winui-content-bg:         #1F1F1F;
                --winui-page-bg:            #181818;

                --winui-text-primary:       #FFFFFF;
                --winui-text-secondary:     #A0A0A0;
                --winui-text-tertiary:      #7A7A7A;

                --winui-accent:             #60CDFF;
                --winui-accent-hover:       #88D8FF;
                --winui-accent-light:       rgba(96, 205, 255, 0.11);
                --winui-accent-subtle:      rgba(96, 205, 255, 0.07);

                --winui-warning:            #FCE100;
                --winui-stroke:             #383838;
                --winui-stroke-strong:      #4A4A4A;
                --winui-stroke-focus:       #60CDFF;

                --winui-shadow-1: 0 1px 3px rgba(0,0,0,0.30);
                --winui-shadow-2: 0 4px 8px rgba(0,0,0,0.36);
                --winui-shadow-4: 0 8px 16px rgba(0,0,0,0.40);

                --bg-primary:     var(--winui-page-bg);
                --bg-card:        var(--winui-content-bg);
                --text-primary:   var(--winui-text-primary);
                --text-secondary: var(--winui-text-secondary);
                --accent:         var(--winui-accent);
                --gold:           var(--winui-warning);
                --line:           var(--winui-stroke);
                --ui-font:        var(--winui-font-ui);
                --code-font:      var(--winui-font-code);

                color-scheme: dark;
            }

            /* ============================================================
               RESET & BASE
               ============================================================ */
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                height: 100%;
                overflow: hidden;
                font-family: var(--winui-font-ui);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--winui-text-primary);
                background: var(--winui-page-bg);
            }

            #app {
                display: flex;
                height: 100vh;
            }

            /* Shared transition */
            #sidebar, #main, #home-btn, #theme-btn, #toggle-btn,
            .nav-item, #meta, #content, pre, code, blockquote,
            .home-time, .home-date, #progress-bar, #progress-track {
                transition:
                    background-color var(--winui-duration-3) var(--winui-ease),
                    color var(--winui-duration-3) var(--winui-ease),
                    border-color var(--winui-duration-3) var(--winui-ease),
                    box-shadow var(--winui-duration-3) var(--winui-ease);
            }

            /* ============================================================
               SIDEBAR — WinUI 3 NavigationView Pane (solid)
               ============================================================ */
            #sidebar {
                width: var(--sidebar-width);
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                position: relative;
                z-index: 10;

                /* Solid pane background — NO acrylic / blur */
                background: var(--winui-pane-bg);

                /* Clean right separator */
                border-right: 1px solid var(--winui-stroke);

                transition:
                    width var(--winui-duration-4) var(--winui-ease),
                    background-color var(--winui-duration-3) var(--winui-ease);
            }

            #sidebar.collapsed {
                width: var(--sidebar-collapsed);
            }

            /* ---- Reorder with flex: WinUI 3 layout ---- */
            #toggle-btn   { order: 0; }  /* hamburger — top */
            #home-btn     { order: 1; }  /* home nav item */
            #nav-list     { order: 2; }  /* article list */
            #theme-btn    { order: 3; }  /* theme — bottom (pane footer) */

            /* ============================================================
               HAMBURGER TOGGLE BUTTON — WinUI 3 PaneToggleButton
               ============================================================ */
            #toggle-btn {
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                padding: 0 12px;
                cursor: pointer;
                flex-shrink: 0;
                user-select: none;
                border-radius: var(--winui-radius-2);
                margin: 4px 8px;
                color: var(--winui-text-primary);
                position: relative;
            }

            #toggle-btn:hover {
                background: var(--winui-pane-hover);
            }

            #toggle-btn:active {
                background: var(--winui-pane-active);
            }

            /* Hamburger icon — 3 lines via CSS */
            #toggle-btn span {
                display: block;
                width: 20px;
                height: 2px;
                background: var(--winui-text-primary);
                border-radius: 1px;
                position: relative;
                transition: background var(--winui-duration-2) var(--winui-ease);
                font-size: 0;
                color: transparent;
            }

            #toggle-btn span::before,
            #toggle-btn span::after {
                content: "";
                position: absolute;
                left: 0;
                width: 20px;
                height: 2px;
                background: var(--winui-text-primary);
                border-radius: 1px;
                transition: transform var(--winui-duration-3) var(--winui-ease),
                            top var(--winui-duration-3) var(--winui-ease);
            }

            #toggle-btn span::before { top: -6px; }
            #toggle-btn span::after  { top:  6px; }

            #sidebar.collapsed #toggle-btn {
                justify-content: center;
                padding: 0;
            }

            /* ============================================================
               HOME BUTTON — styled as a nav item
               ============================================================ */
            #home-btn {
                height: 40px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                cursor: pointer;
                flex-shrink: 0;
                font-weight: 400;
                font-size: 0.9rem;
                letter-spacing: 0.3px;
                color: var(--winui-text-primary);
                user-select: none;
                border-radius: var(--winui-radius-2);
                margin: 1px 8px;
                position: relative;
                border-left: 3px solid transparent;
            }

            #home-btn:hover {
                background: var(--winui-pane-hover);
            }

            #home-btn:active {
                background: var(--winui-pane-active);
            }

            /* Home icon in collapsed mode */
            #sidebar.collapsed #home-btn {
                justify-content: center;
                padding: 0;
            }

            #sidebar.collapsed #home-btn span {
                display: none;
            }

            #sidebar.collapsed #home-btn::after {
                content: "▣";
                font-size: 1.1rem;
                color: var(--winui-accent);
                position: static;
            }

            #sidebar.collapsed #home-btn::before {
                display: none;
            }

            /* ============================================================
               NAV LIST
               ============================================================ */
            #nav-list {
                list-style: none;
                padding: 4px 8px;
                margin: 0;
                overflow-y: auto;
                flex-grow: 1;
            }

            .nav-item {
                height: 40px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                cursor: pointer;
                font-size: 0.875rem;
                white-space: nowrap;
                color: var(--winui-text-primary);
                letter-spacing: 0.2px;
                border-radius: var(--winui-radius-2);
                margin: 1px 0;
                position: relative;
                user-select: none;
                border-left: 3px solid transparent;
            }

            .nav-item:hover {
                background: var(--winui-pane-hover);
            }

            .nav-item:active {
                background: var(--winui-pane-active);
            }

            /* Selected — accent left indicator + subtle accent bg */
            .nav-item.active {
                color: var(--winui-text-primary);
                font-weight: 500;
                background: var(--winui-accent-subtle);
                border-left-color: var(--winui-accent);
            }

            /* ---- Collapsed: nav items show icon-only ---- */
            #sidebar.collapsed .nav-item {
                justify-content: center;
                padding: 0;
                font-size: 0;
                color: transparent;
                border-left-width: 0;
            }

            #sidebar.collapsed .nav-item::before {
                content: "●";
                font-size: 0.5rem;
                color: var(--winui-text-tertiary);
                opacity: 0.6;
            }

            #sidebar.collapsed .nav-item.active::before {
                color: var(--winui-accent);
                opacity: 1;
                font-size: 0.6rem;
            }

            #sidebar.collapsed .nav-item:hover {
                background: var(--winui-pane-hover);
            }

            /* ============================================================
               THEME TOGGLE — pane footer (WinUI 3 settings gear pattern)
               ============================================================ */
            #theme-btn {
                height: 40px;
                display: flex;
                align-items: center;
                padding: 0 16px;
                cursor: pointer;
                flex-shrink: 0;
                font-size: 0.8rem;
                letter-spacing: 0.5px;
                color: var(--winui-text-secondary);
                user-select: none;
                margin: 2px 8px;
                border-radius: var(--winui-radius-2);
                border-top: 1px solid var(--winui-stroke);
                margin-top: 4px;
                padding-top: 12px;
                height: 48px;
            }

            #theme-btn:hover {
                background: var(--winui-pane-hover);
                color: var(--winui-text-primary);
            }

            #theme-btn:active {
                background: var(--winui-pane-active);
            }

            #sidebar.collapsed #theme-btn {
                justify-content: center;
                padding: 0;
                font-size: 0;
                color: transparent;
            }

            #sidebar.collapsed #theme-btn::before {
                content: "◐";
                font-size: 1rem;
                color: var(--winui-text-secondary);
            }

            #sidebar.collapsed #theme-btn:hover::before {
                color: var(--winui-text-primary);
            }

            /* ============================================================
               MAIN CONTENT — WinUI 3 content host (white surface)
               ============================================================ */
            #main {
                flex: 1;
                padding: 40px 56px;
                overflow-y: auto;
                scroll-behavior: auto;
                position: relative;
                background: var(--winui-content-bg);
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            @media (max-width: 768px) {
                #main {
                    padding: 24px 20px;
                }
            }

            #meta {
                font-size: 0.72rem;
                color: var(--winui-text-tertiary);
                padding-bottom: 10px;
                margin-bottom: 0;
                letter-spacing: 0.8px;
                display: flex;
                justify-content: space-between;
                font-weight: 500;
                text-transform: uppercase;
                width: 100%;
                max-width: 800px;
            }

            /* ============================================================
               PROGRESS BAR — WinUI ProgressBar
               ============================================================ */
            #progress-track {
                width: 100%;
                max-width: 800px;
                height: 3px;
                background: var(--winui-stroke);
                margin-bottom: 32px;
                position: relative;
                border-radius: 2px;
                overflow: hidden;
            }

            #progress-bar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: var(--winui-accent);
                border-radius: 2px;
                transition: width 0.1s linear, background var(--winui-duration-3) var(--winui-ease);
            }

            /* ============================================================
               CONTENT TYPOGRAPHY
               ============================================================ */
            #content {
                width: 100%;
                max-width: 800px;
                font-size: 1.05rem;
                line-height: 1.75;
                color: var(--winui-text-primary);
            }

            #content h1, #content h2, #content h3 {
                color: var(--winui-text-primary);
                margin: 1.5em 0 0.5em;
                font-weight: 600;
                letter-spacing: 0.2px;
                line-height: 1.3;
            }

            #content h1 {
                font-size: 1.75rem;
                padding-bottom: 8px;
                border-bottom: 2px solid var(--winui-stroke);
            }

            #content h2 { font-size: 1.4rem; }
            #content h3 { font-size: 1.15rem; }

            #content h1:first-child { margin-top: 0; }

            #content p {
                margin: 0 0 1em;
            }

            #content a {
                color: var(--winui-accent);
                text-decoration: none;
                font-weight: 500;
                border-bottom: 1px solid transparent;
                transition: border-color var(--winui-duration-2) var(--winui-ease);
            }

            #content a:hover {
                border-bottom-color: var(--winui-accent);
            }

            /* ============================================================
               BLOCKQUOTE
               ============================================================ */
            #content blockquote {
                margin: 1.2em 0;
                padding: 14px 20px;
                border-left: 4px solid var(--winui-warning);
                background: var(--winui-content-bg);
                border-radius: 0 var(--winui-radius-2) var(--winui-radius-2) 0;
                box-shadow: var(--winui-shadow-1);
                color: var(--winui-text-primary);
                font-size: 0.95em;
            }

            #content blockquote p {
                margin: 0;
            }

            /* ============================================================
               CODE
               ============================================================ */
            pre {
                background: var(--winui-pane-bg);
                padding: 18px 20px;
                border-left: 4px solid var(--winui-warning);
                border-radius: var(--winui-radius-2);
                overflow-x: auto;
                margin: 1.2em 0;
                position: relative;
                box-shadow: var(--winui-shadow-1);
            }

            code {
                font-family: var(--winui-font-code);
                color: var(--winui-text-primary);
                font-size: 0.875em;
            }

            p code, li code {
                background: var(--winui-pane-bg);
                padding: 2px 8px;
                border-radius: var(--winui-radius-1);
                border: 1px solid var(--winui-stroke);
                font-size: 0.85em;
            }

            pre code {
                font-size: 0.85rem;
                line-height: 1.55;
            }

            /* ============================================================
               LISTS
               ============================================================ */
            #content ul, #content ol {
                margin: 0 0 1em;
                padding-left: 1.5em;
            }

            #content li {
                margin: 0.25em 0;
            }

            #content ul ul, #content ol ol, #content ul ol, #content ol ul {
                margin-bottom: 0;
            }

            /* ============================================================
               TABLES
               ============================================================ */
            #content table {
                width: 100%;
                border-collapse: collapse;
                margin: 1.2em 0;
                border-radius: var(--winui-radius-2);
                overflow: hidden;
                box-shadow: var(--winui-shadow-1);
            }

            #content th, #content td {
                padding: 10px 16px;
                text-align: left;
                background: var(--winui-content-bg);
                border-bottom: 1px solid var(--winui-stroke);
            }

            #content th {
                font-weight: 600;
                font-size: 0.85em;
                color: var(--winui-text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            #content tr:last-child td {
                border-bottom: none;
            }

            #content td {
                color: var(--winui-text-primary);
            }

            /* ============================================================
               HORIZONTAL RULE
               ============================================================ */
            #content hr {
                border: none;
                height: 1px;
                background: var(--winui-stroke);
                margin: 1.5em 0;
            }

            /* ============================================================
               IMAGES
               ============================================================ */
            #content img {
                max-width: 100%;
                border-radius: var(--winui-radius-2);
                box-shadow: var(--winui-shadow-1);
            }

            /* ============================================================
               HOME VIEW
               ============================================================ */
            .home {
                width: 100%;
                max-width: 800px;
                height: 60vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }

            .home-time {
                font-size: 4.5rem;
                letter-spacing: 4px;
                color: var(--winui-accent);
                font-weight: 300;
                font-variant-numeric: tabular-nums;
                font-family: var(--winui-font-code);
            }

            .home-date {
                font-size: 1rem;
                color: var(--winui-text-tertiary);
                margin-top: 8px;
                letter-spacing: 1px;
                font-weight: 400;
            }

            /* ============================================================
               TYPING CURSOR
               ============================================================ */
            .typing::after {
                content: "▊";
                margin-left: 4px;
                color: var(--winui-accent);
                animation: blink 0.8s infinite;
            }

            @keyframes blink {
                50% { opacity: 0; }
            }

            /* ============================================================
               SCROLLBAR
               ============================================================ */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--winui-stroke-strong);
                border-radius: 3px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--winui-text-tertiary);
            }

            /* ============================================================
               SELECTION
               ============================================================ */
            ::selection {
                background: rgba(0, 120, 212, 0.20);
                color: var(--winui-text-primary);
            }

            [data-theme="dark"] ::selection {
                background: rgba(96, 205, 255, 0.25);
            }

            /* ============================================================
               FOCUS VISIBLE
               ============================================================ */
            :focus-visible {
                outline: 2px solid var(--winui-stroke-focus);
                outline-offset: 2px;
                border-radius: var(--winui-radius-1);
            }

            /* ============================================================
               CODE LANGUAGE BADGE — styled in JS
               ============================================================ */
        </style>
    </head>

    <body>
        <div id="app">
            <aside id="sidebar">
                <!-- order: toggle-btn → home-btn → nav-list → theme-btn -->
                <div id="home-btn" onclick="showHome()" tabindex="0" role="button" aria-label="返回首页">
                    <span>HOME</span>
                </div>
                <div id="theme-btn" onclick="toggleTheme()" tabindex="0" role="button" aria-label="切换主题">
                    <span id="theme-text">暗色</span>
                </div>
                <div id="toggle-btn" onclick="toggleSidebar()" tabindex="0" role="button" aria-label="折叠侧边栏">
                    <span></span>
                </div>
                <ul id="nav-list">
                    <li class="nav-item">Loading index...</li>
                </ul>
            </aside>

            <main id="main">
                <div id="meta">
                    <span id="meta-info">SYSTEM READY</span>
                    <span id="meta-file"></span>
                </div>

                <div id="progress-track">
                    <div id="progress-bar"></div>
                </div>

                <article id="content"></article>
            </main>
        </div>

        <script>
            const content = document.getElementById("content");
            const metaInfo = document.getElementById("meta-info");
            const metaFile = document.getElementById("meta-file");
            const progressBar = document.getElementById("progress-bar");
            const themeText = document.getElementById("theme-text");

            let collapsed = false;
            let clockTimer = null;
            let typingTimer = null;
            let isTyping = false;

            /* ===== Theme ===== */
            function toggleTheme() {
                const html = document.documentElement;
                const current = html.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                html.setAttribute("data-theme", next);
                themeText.innerText = next === "light" ? "暗色" : "亮色";
                try {
                    localStorage.setItem("rumia-theme", next);
                } catch (e) {}
            }

            function initTheme() {
                try {
                    const saved = localStorage.getItem("rumia-theme");
                    if (saved === "dark") {
                        document.documentElement.setAttribute("data-theme", "dark");
                        themeText.innerText = "亮色";
                    }
                } catch (e) {}
            }

            /* ===== Sidebar ===== */
            function toggleSidebar() {
                const sb = document.getElementById("sidebar");
                collapsed = !collapsed;
                sb.classList.toggle("collapsed", collapsed);
            }

            /* ===== Home ===== */
            function showHome() {
                stopTyping();
                clearActiveStatus();
                clearInterval(clockTimer);

                content.classList.remove("typing");
                metaInfo.innerText = "SYSTEM IDLE";
                metaFile.innerText = "";
                progressBar.style.width = "0%";

                content.innerHTML = `
        <div class="home">
            <div class="home-time" id="clock">--:--:--</div>
            <div class="home-date" id="date"></div>
        </div>`;

                updateClock();
                clockTimer = setInterval(updateClock, 1000);
            }

            function updateClock() {
                const clockEl = document.getElementById("clock");
                if (!clockEl) return;
                const n = new Date();
                clockEl.innerText = n.toLocaleTimeString("en-GB");
                document.getElementById("date").innerText = n.toDateString();
            }

            /* ===== Load Index ===== */
            async function loadIndex() {
                try {
                    const r = await fetch("index.json");
                    const list = await r.json();
                    const nav = document.getElementById("nav-list");
                    nav.innerHTML = "";

                    list.forEach((a, index) => {
                        const li = document.createElement("li");
                        li.className = "nav-item";
                        li.id = "nav-item-" + index;
                        li.innerText = a.title;
                        li.title = a.title;
                        li.onclick = () => {
                            clearActiveStatus();
                            li.classList.add("active");
                            loadArticle(a);
                        };
                        nav.appendChild(li);
                    });
                } catch (e) {
                    document.getElementById("nav-list").innerHTML =
                        "<li class='nav-item'>INDEX LOAD ERROR</li>";
                }
            }

            function clearActiveStatus() {
                document
                    .querySelectorAll(".nav-item")
                    .forEach((el) => el.classList.remove("active"));
            }

            /* ===== Load Article ===== */
            async function loadArticle(a) {
                stopTyping();
                clearInterval(clockTimer);

                document.getElementById("main").scrollTop = 0;
                progressBar.style.width = "0%";

                metaInfo.innerText = `AUTH: ${a.author} | DATE: ${a.date}`;
                metaFile.innerText = `FILE: ${a.path}`;

                content.innerHTML = "";

                try {
                    const r = await fetch(a.path);
                    const md = await r.text();
                    const html = marked.parse(md);
                    typeHTML(html);
                } catch {
                    content.innerText = "FILE NOT FOUND: " + a.path;
                    content.classList.remove("typing");
                }
            }

            function stopTyping() {
                isTyping = false;
                if (typingTimer) {
                    clearInterval(typingTimer);
                    typingTimer = null;
                }
            }

            /* ===== Typewriter ===== */
            async function typeHTML(html) {
                isTyping = true;
                content.classList.add("typing");

                const temp = document.createElement("div");
                temp.innerHTML = html;
                const nodes = Array.from(temp.childNodes);
                const totalNodes = nodes.length;

                for (let i = 0; i < nodes.length; i++) {
                    if (!isTyping) break;

                    const node = nodes[i];
                    const progress = ((i + 1) / totalNodes) * 100;
                    progressBar.style.width = progress + "%";

                    const container = node.cloneNode(false);
                    content.appendChild(container);

                    if (node.nodeType === Node.TEXT_NODE) {
                        await typeText(node.textContent, container);
                    } else {
                        container.innerHTML = node.innerHTML;

                        if (window.renderMathInElement) {
                            renderMathInElement(container, {
                                delimiters: [
                                    { left: "$$", right: "$$", display: true },
                                    { left: "$", right: "$", display: false },
                                ],
                                throwOnError: false,
                            });
                        }

                        handleCodeLabels(container);
                        await new Promise((r) => setTimeout(r, 80));
                    }
                }

                content.classList.remove("typing");
                isTyping = false;
            }

            function typeText(text, target) {
                return new Promise((resolve) => {
                    let i = 0;
                    const interval = setInterval(() => {
                        if (!isTyping) {
                            clearInterval(interval);
                            resolve();
                            return;
                        }

                        target.textContent += text[i++];

                        if (i >= text.length) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 5);
                });
            }

            function handleCodeLabels(container) {
                const codeBlocks = container.querySelectorAll("pre code");
                codeBlocks.forEach((code) => {
                    const className = code.className;
                    if (className.startsWith("language-")) {
                        const lang = className
                            .replace("language-", "")
                            .toUpperCase();
                        const label = document.createElement("div");
                        label.innerText = lang;
                        Object.assign(label.style, {
                            position: "absolute",
                            top: "8px",
                            right: "12px",
                            fontSize: "0.7rem",
                            color: "var(--winui-text-tertiary)",
                            letterSpacing: "1px",
                            fontWeight: "600",
                            background: "var(--winui-pane-hover)",
                            padding: "2px 10px",
                            borderRadius: "var(--winui-radius-1)",
                            pointerEvents: "none",
                        });
                        code.parentElement.style.position = "relative";
                        code.parentElement.appendChild(label);
                    }
                });
            }

            /* ===== Init ===== */
            initTheme();
            showHome();
            loadIndex();
        </script>
    </body>
</html>
