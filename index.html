<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal Doc Reader</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
    --amber: #d4a35e;
    --amber-bright: #f0c987;
    --amber-dim: #5e4a2d;
    --bg: #1a1815;
    --ui-font: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --code-font: "JetBrains Mono","Fira Code","Cascadia Code","Consolas",monospace;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--amber);
    font-family: var(--ui-font);
    overflow: hidden;
}

/* ===== Layout ===== */
#app {
    display: flex;
    height: 100vh;
    border: 1px solid var(--amber-dim);
}

#sidebar {
    width: 280px;
    transition: width .4s cubic-bezier(.16,1,.3,1);
    border-right: 1px solid var(--amber-dim);
    background: rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#sidebar.collapsed { width: 60px; }

/* ===== Sidebar Buttons ===== */
#home-btn {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-bottom: 1px solid var(--amber-dim);
    transition: all 0.3s;
    letter-spacing: 4px;
}

#home-btn:hover { background: var(--amber-dim); color: var(--bg); }

/* 折叠后的 Home 变成一个纯色圆点 */
#sidebar.collapsed #home-btn::after {
    content: "";
    width: 12px;
    height: 12px;
    background: var(--amber);
    border-radius: 100%;
    box-shadow: 0 0 8px var(--amber);
}
#sidebar.collapsed #home-btn span { display: none; }

#toggle-btn {
    padding: 18px 0;
    text-align: center;
    cursor: pointer;
    border-bottom: 1px solid var(--amber-dim);
    font-weight: bold;
    transition: all 0.3s;
}
#toggle-btn:hover { background: var(--amber-dim); color: var(--bg); }

/* 折叠时隐藏文字 */
#sidebar.collapsed .nav-item,
#sidebar.collapsed #toggle-btn span {
    opacity: 0;
    pointer-events: none;
}

#nav-list {
    list-style: none;
    padding: 12px 0;
    margin: 0;
    overflow-y: auto;
    flex-grow: 1;
}

.nav-item {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 1.05em;
    white-space: nowrap;
    transition: all 0.2s;
    border-left: 3px solid transparent;
}

.nav-item:hover {
    background: rgba(212, 163, 94, 0.1);
}

/* 当前阅读项的高亮样式 */
.nav-item.active {
    background: var(--amber);
    color: var(--bg);
    font-weight: bold;
    border-left: 3px solid var(--amber-bright);
}

/* ===== Main ===== */
#main {
    flex: 1;
    padding: 40px 60px;
    overflow-y: auto;
    scroll-behavior: smooth;
}

#meta {
    font-size: .85em;
    opacity: .7;
    border-bottom: 1px solid var(--amber-dim);
    padding-bottom: 10px;
    margin-bottom: 30px;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
}

#content {
    max-width: 820px;
    font-size: 1.2rem;
    line-height: 1.6;
}

/* ===== Typing cursor ===== */
.typing::after {
    content: "▊";
    margin-left: 4px;
    animation: blink .8s infinite;
}

@keyframes blink { 50% { opacity: 0; } }

/* ===== Home View ===== */
.home {
    height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: left;
}
.home-time { font-size: 5rem; letter-spacing: 4px; }
.home-date { font-size: 1.2rem; opacity: .6; }

/* ===== Markdown Elements ===== */
#content h1, #content h2, #content h3 { color: var(--amber-bright); margin: 1.5em 0 0.8em; }
pre { background: #12100d; padding: 16px; border-left: 4px solid var(--amber); overflow-x: auto; }
code { font-family: var(--code-font); color: var(--amber-bright); }
p code { background: #2a2217; padding: 2px 6px; border-radius: 4px; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--amber-dim); }
</style>
</head>

<body>
<div id="app">

<aside id="sidebar">
    <div id="home-btn" onclick="showHome()">
        <span>HOME</span>
    </div>
    <div id="toggle-btn" onclick="toggleSidebar()">
        <span>[ 目录 ]</span>
    </div>
    <ul id="nav-list">
        <li class="nav-item">Loading index...</li>
    </ul>
</aside>

<main id="main">
    <div id="meta">
        <span id="meta-info">SYSTEM READY</span>
        <span id="meta-file"></span>
    </div>
    <article id="content"></article>
</main>

</div>

<script>
const content = document.getElementById("content");
const metaInfo = document.getElementById("meta-info");
const metaFile = document.getElementById("meta-file");
let collapsed = false;
let clockTimer = null;
let typingTimer = null;

/* ===== 侧边栏折叠 ===== */
function toggleSidebar() {
    const sb = document.getElementById("sidebar");
    const btnText = document.querySelector("#toggle-btn span");
    collapsed = !collapsed;
    sb.classList.toggle("collapsed", collapsed);
    btnText.innerText = collapsed ? ">" : "[ 目录 ]";
}

/* ===== 主页显示 ===== */
function showHome() {
    stopTyping();
    clearActiveStatus();
    clearInterval(clockTimer);
    
    content.classList.remove("typing");
    metaInfo.innerText = "SYSTEM IDLE";
    metaFile.innerText = "";
    
    content.innerHTML = `
        <div class="home">
            <div class="home-time" id="clock">--:--:--</div>
            <div class="home-date" id="date"></div>
        </div>`;
    
    updateClock();
    clockTimer = setInterval(updateClock, 1000);
}

function updateClock() {
    const clockEl = document.getElementById("clock");
    if(!clockEl) return;
    const n = new Date();
    clockEl.innerText = n.toLocaleTimeString("en-GB");
    document.getElementById("date").innerText = n.toDateString();
}

/* ===== 加载索引 ===== */
async function loadIndex() {
    try {
        const r = await fetch("index.json");
        const list = await r.json();
        const nav = document.getElementById("nav-list");
        nav.innerHTML = "";
        
        list.forEach((a, index) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.id = "nav-item-" + index; // 分配ID方便查找
            li.innerText = "> " + a.title;
            li.onclick = () => {
                clearActiveStatus();
                li.classList.add("active"); // 点击时设为活跃
                loadArticle(a);
            };
            nav.appendChild(li);
        });
    } catch (e) {
        document.getElementById("nav-list").innerHTML = "<li class='nav-item'>INDEX LOAD ERROR</li>";
    }
}

/* ===== 清除目录高亮 ===== */
function clearActiveStatus() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

/* ===== 加载文章内容 ===== */
async function loadArticle(a) {
    stopTyping();
    clearInterval(clockTimer);
    
    // 更新 Meta 栏，包含文件名
    metaInfo.innerText = `AUTH: ${a.author} | DATE: ${a.date}`;
    metaFile.innerText = `FILE: ${a.path}`; 
    
    content.innerHTML = "";
    content.classList.add("typing");

    try {
        const r = await fetch(a.path);
        const md = await r.text();
        const html = marked.parse(md);
        typeHTML(html, 600);
    } catch {
        content.innerText = "FILE NOT FOUND: " + a.path;
        content.classList.remove("typing");
    }
}

/* ===== 打字机逻辑修复 ===== */
function stopTyping() {
    if (typingTimer) {
        clearInterval(typingTimer);
        typingTimer = null;
    }
}

function typeHTML(html, totalTime = 100) {
    const temp = document.createElement("div");
    temp.innerHTML = html;
    const text = temp.innerHTML;
    const len = text.length;
    // 动态调整速度，最快1ms一跳
    const interval = Math.max(1, totalTime / len);

    let i = 0;
    content.innerHTML = "";

    typingTimer = setInterval(() => {
        content.innerHTML = text.slice(0, i++);
        // 自动滚动到底部
        const mainEl = document.getElementById("main");
        mainEl.scrollTop = mainEl.scrollHeight;
        
        if (i >= len) {
            stopTyping();
            content.classList.remove("typing");
        }
    }, interval);
}

/* ===== 初始化 ===== */
showHome();
loadIndex();
</script>
</body>
</html>
