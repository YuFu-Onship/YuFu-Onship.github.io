<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuFu-Onship :: TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* --- TUI / Cyberpunk Terminal CSS --- */
        :root {
            --term-bg: #0a0a0a;
            --term-color: #ffb000; /* 经典的琥珀色/橙色 */
            --term-dim: #996600;
            --term-accent: #ffcc00;
            --scanline: rgba(0, 0, 0, 0.5);
            --glow: 0 0 5px rgba(255, 176, 0, 0.4), 0 0 10px rgba(255, 176, 0, 0.2);
            --font-stack: 'VT323', monospace;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-color);
            font-family: var(--font-stack);
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            /* 文字发光效果 */
            text-shadow: var(--glow);
        }

        /* --- CRT 屏幕效果层 --- */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                to bottom,
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            animation: scanlines 10s linear infinite;
        }

        /* 屏幕整体微闪 */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.99; }
            50% { opacity: 0.95; }
            80% { opacity: 0.9; }
            100% { opacity: 0.97; }
        }
        
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
            animation: flicker 0.15s infinite; /* 极速微闪 */
            z-index: 1;
        }

        /* 滚动条样式自定义 */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #111; border-left: 1px solid var(--term-dim); }
        ::-webkit-scrollbar-thumb { background: var(--term-dim); border: 1px solid var(--term-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--term-color); }

        /* --- 左侧侧边栏 --- */
        .sidebar {
            width: 260px;
            background-color: #000;
            border-right: 2px solid var(--term-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }

        .sidebar-header {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--term-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .sidebar-header::before {
            content: "> ";
            animation: blink 1s step-end infinite;
        }

        /* 文档链接样式 */
        .doc-link {
            display: block;
            padding: 8px 10px;
            text-decoration: none;
            color: var(--term-color);
            border: 1px solid transparent;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 1.3rem;
        }

        .doc-link:hover {
            border: 1px solid var(--term-dim);
            background-color: rgba(255, 176, 0, 0.1);
        }

        .doc-link.active {
            background-color: var(--term-color);
            color: #000; /* 反色 */
            font-weight: bold;
            box-shadow: 0 0 10px var(--term-color);
            text-shadow: none;
        }

        .doc-link.active::before {
            content: "[x] ";
        }
        .doc-link:not(.active)::before {
            content: "[ ] ";
        }

        /* --- 右侧主内容区 --- */
        .main-content {
            flex-grow: 1;
            padding: 0;
            overflow-y: auto;
            position: relative;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* 内容区顶部状态栏 */
        .status-bar {
            background: var(--term-color);
            color: #000;
            padding: 5px 20px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            text-shadow: none;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #markdown-viewer {
            padding: 40px 60px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Markdown 内部元素样式 TUI化 */
        #markdown-viewer h1 { 
            color: var(--term-accent); 
            border-bottom: 2px double var(--term-color); 
            padding-bottom: 10px; 
            text-transform: uppercase;
        }
        #markdown-viewer h2 { 
            margin-top: 1.5em; 
            color: var(--term-color);
            border-bottom: 1px dashed var(--term-dim); 
        }
        #markdown-viewer a { color: #fff; text-decoration: underline; }
        #markdown-viewer strong { color: #fff; }
        
        #markdown-viewer code { 
            background-color: #222; 
            color: #fff;
            padding: 2px 6px; 
            font-family: 'Courier New', monospace;
            border: 1px solid #444;
        }
        
        #markdown-viewer pre { 
            background-color: #111; 
            border: 1px solid var(--term-dim); 
            padding: 15px; 
            overflow-x: auto; 
            position: relative;
        }
        
        #markdown-viewer blockquote { 
            border-left: 4px solid var(--term-dim); 
            margin: 0; 
            padding-left: 15px; 
            color: var(--term-dim);
            font-style: italic;
        }
        
        #markdown-viewer img {
            max-width: 100%;
            filter: grayscale(100%) sepia(100%) hue-rotate(0deg) saturate(500%); /* 图片也变成橙色风格 */
            border: 1px solid var(--term-dim);
        }

        /* 动画关键帧 */
        @keyframes blink { 50% { opacity: 0; } }
        
        /* 故障加载效果 */
        .glitch-load {
            animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body { height: auto; overflow: auto; }
            #app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--term-color); height: auto; }
            .main-content { height: calc(100vh - 200px); }
            #markdown-viewer { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">SYSTEM_ROOT</div>
            <div id="file-list">
                <a class="doc-link" onclick="loadDoc(this, 'intro.md')">intro.md</a>
            </div>
            
            <div style="margin-top: auto; font-size: 0.8rem; color: var(--term-dim); border-top: 1px solid var(--term-dim); padding-top: 10px;">
                <p>STATUS: ONLINE</p>
                <p>MEM: 64KB OK</p>
            </div>
        </nav>

        <main class="main-content">
            <div class="status-bar">
                <span id="doc-title">NO_FILE_LOADED</span>
                <span id="clock">00:00:00</span>
            </div>
            <div id="markdown-viewer">
                <div style="text-align: center; margin-top: 100px;">
                    <pre style="display:inline-block; border:none; background:none; text-align:left;">
   _____ YUFU-ONSHIP _____
  /     \             /     \
 |  (o)  | TERMINAL  |  (o)  |
  \_____/             \_____/
                    </pre>
                    <p class="blink" style="margin-top:20px;">> WAITING FOR INPUT_</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const viewer = document.getElementById('markdown-viewer');
        const docTitle = document.getElementById('doc-title');
        const links = document.querySelectorAll('.doc-link');

        // 简单的时钟功能
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        // 打字机/故障效果渲染
        async function loadDoc(element, filename) {
            // 1. UI 更新
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');
            docTitle.innerText = filename.toUpperCase();

            // 2. 模拟加载动画
            viewer.innerHTML = '<p class="blink">> ESTABLISHING CONNECTION...</p><p>> DOWNLOADING PACKETS...</p>';
            viewer.classList.add('glitch-load'); // 添加故障抖动

            try {
                // 3. 模拟网络延迟 (为了看来更像旧电脑)
                await new Promise(r => setTimeout(r, 600));

                const response = await fetch(`./doc/${filename}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const markdownText = await response.text();
                
                // 4. 移除故障效果并渲染
                viewer.classList.remove('glitch-load');
                viewer.innerHTML = marked.parse(markdownText);

            } catch (error) {
                viewer.classList.remove('glitch-load');
                viewer.innerHTML = `
                    <h2 style="color: red; border-bottom: 2px solid red;">ERROR: 404_NOT_FOUND</h2>
                    <p>> The file ./doc/${filename} seems to be corrupted or missing.</p>
                    <p>> SYSTEM HALTED.</p>
                `;
            }
        }

        // 初始化时钟
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    </script>

</body>
</html>
