<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Doc Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --amber: #ffb000;
            --amber-dim: #936500;
            --bg-color: #120b00;
            --font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--amber);
            font-family: var(--font-family);
            height: 100%;
            overflow: hidden;
        }

        /* 布局框架 */
        #app {
            display: flex;
            height: 100vh;
            border: 2px solid var(--amber);
            box-sizing: border-box;
            margin: 5px;
        }

        /* 左侧侧边栏 */
        #sidebar {
            width: 250px;
            border-right: 2px solid var(--amber);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            white-space: nowrap;
        }

        #sidebar.collapsed {
            width: 40px;
        }

        /* 侧边栏头部/开关 */
        #toggle-btn {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--amber-dim);
            text-align: center;
            font-weight: bold;
        }

        #toggle-btn:hover { background: var(--amber-dim); color: var(--bg-color); }

        /* 文章列表 */
        #nav-list {
            padding: 10px;
            list-style: none;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .nav-item {
            padding: 8px 5px;
            cursor: pointer;
            border: 1px transparent;
            margin-bottom: 5px;
        }

        .nav-item:hover {
            background-color: var(--amber-dim);
            color: var(--bg-color);
        }

        /* 右侧内容区 */
        #main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* 文章元数据信息 */
        #meta-info {
            font-size: 0.9em;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--amber);
            padding-bottom: 10px;
            opacity: 0.8;
        }

        /* Markdown 内容样式 */
        #content-area {
            line-height: 1.6;
        }

        #content-area h1, #content-area h2 { border-bottom: 1px solid var(--amber-dim); }
        #content-area code { background: #2a1a00; padding: 2px 5px; }

        /* 打字机效果光标 */
        .typing::after {
            content: '_';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--amber-dim); }
    </style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div id="toggle-btn" onclick="toggleSidebar()"> [ 目录 ] </div>
        <ul id="nav-list">
            <li>Loading...</li>
        </ul>
    </aside>

    <main id="main-content">
        <div id="meta-info">Ready to process...</div>
        <article id="content-area"></article>
    </main>
</div>

<script>
    let isCollapsed = false;
    const contentArea = document.getElementById('content-area');
    const metaInfo = document.getElementById('meta-info');

    // 1. 切换侧边栏
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const btn = document.getElementById('toggle-btn');
        isCollapsed = !isCollapsed;

        if (isCollapsed) {
            sidebar.classList.add('collapsed');
            btn.innerHTML = " > ";
        } else {
            sidebar.classList.remove('collapsed');
            btn.innerHTML = "[ 目录 ]";
        }
    }

    // 2. 加载 JSON 数据
    async function loadConfig() {
        try {
            const response = await fetch('index.json');
            const data = await response.json();
            renderNav(data);
        } catch (err) {
            metaInfo.innerText = "Error: 无法加载 index.json";
        }
    }

    // 3. 渲染导航列表
    function renderNav(articles) {
        const navList = document.getElementById('nav-list');
        navList.innerHTML = '';
        articles.forEach(art => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            li.innerHTML = `> ${art.title}`;
            li.onclick = () => loadArticle(art);
            navList.appendChild(li);
        });
    }

    // 4. 加载并展示 Markdown 文章
    async function loadArticle(art) {
        contentArea.innerHTML = '';
        contentArea.classList.add('typing');
        metaInfo.innerHTML = `TITLE: ${art.title} | AUTHOR: ${art.author} | DATE: ${art.date} | CAT: ${art.category}`;

        try {
            const response = await fetch(art.path);
            const text = await response.text();
            const htmlContent = marked.parse(text);

            // 打字机效果显示
            typeWriter(htmlContent);
        } catch (err) {
            contentArea.innerHTML = "Error: 无法读取文章文件内容。";
        }
    }

    // 5. 打字机输出逻辑
    function typeWriter(html) {
        let i = 0;
        contentArea.innerHTML = "";

        // 为了性能和HTML标签安全，这里采用分块插入
        // 如果想实现逐字，HTML解析会比较复杂，这里使用“快速呈现”逻辑
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        const nodes = Array.from(tempDiv.childNodes);

        let nodeIndex = 0;
        function renderNode() {
            if (nodeIndex < nodes.length) {
                contentArea.appendChild(nodes[nodeIndex].cloneNode(true));
                nodeIndex++;
                // 这里的速度可以调节，20ms 是一个比较流畅的“终端”感
                setTimeout(renderNode, 20);
                contentArea.scrollTop = contentArea.scrollHeight;
            } else {
                contentArea.classList.remove('typing');
            }
        }
        renderNode();
    }

    // 初始化
    loadConfig();
</script>

</body>
</html>
