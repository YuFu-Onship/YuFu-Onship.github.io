<!doctype html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>YuFu-Onship</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        ></script>

        <style>
            :root {
                --bg-primary: #F8F9FA;
                --bg-card: #FFFFFF;
                --text-primary: #1A1A1E;
                --text-secondary: #6C757D;
                --accent: #D32F2F;
                --gold: #F5B041;
                --line: #E9ECEF;
                --sidebar-width: 280px;
                --sidebar-collapsed: 56px;
                --ui-font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
                --code-font: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
                color-scheme: light;
            }

            [data-theme="dark"] {
                --bg-primary: #121214;
                --bg-card: #1E1E24;
                --text-primary: #E0E0E6;
                --text-secondary: #A0A0AA;
                --accent: #FF4D4D;
                --gold: #FFC107;
                --line: #2C2C35;
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                height: 100%;
                background: var(--bg-primary);
                color: var(--text-primary);
                font-family: var(--ui-font);
                overflow: hidden;
            }

            #app {
                display: flex;
                height: 100vh;
            }

            #sidebar, #main, #home-btn, #theme-btn, #toggle-btn, .nav-item,
            #meta, #content, pre, code, blockquote, .home-time, .home-date {
                transition: background-color 0.35s ease, color 0.35s ease;
            }

            /* ===== Sidebar ===== */
            #sidebar {
                width: var(--sidebar-width);
                transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                background: var(--bg-card);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                flex-shrink: 0;
            }

            #sidebar.collapsed {
                width: var(--sidebar-collapsed);
            }

            #sidebar.collapsed #home-btn span,
            #sidebar.collapsed #theme-btn,
            #sidebar.collapsed .nav-item {
                opacity: 0;
                pointer-events: none;
            }

            #sidebar.collapsed #home-btn::after {
                content: "";
                width: 10px;
                height: 10px;
                background: var(--accent);
                border-radius: 50%;
                position: absolute;
            }

            #sidebar.collapsed #home-btn {
                justify-content: center;
            }

            #sidebar.collapsed #toggle-btn {
                padding: 0;
                justify-content: center;
            }

            /* ===== Home Button ===== */
            #home-btn {
                height: 56px;
                display: flex;
                align-items: center;
                padding: 0 24px;
                cursor: pointer;
                letter-spacing: 3px;
                flex-shrink: 0;
                color: var(--accent);
                font-weight: 600;
                font-size: 0.95rem;
                position: relative;
            }

            /* ===== Theme Toggle ===== */
            #theme-btn {
                height: 44px;
                display: flex;
                align-items: center;
                padding: 0 24px;
                cursor: pointer;
                flex-shrink: 0;
                font-size: 0.85rem;
                color: var(--text-secondary);
                letter-spacing: 1px;
            }

            #theme-btn:hover {
                color: var(--accent);
            }

            /* ===== Toggle Button ===== */
            #toggle-btn {
                height: 44px;
                display: flex;
                align-items: center;
                padding: 0 24px;
                cursor: pointer;
                font-weight: 500;
                flex-shrink: 0;
                font-size: 0.9rem;
                color: var(--text-secondary);
                letter-spacing: 1px;
            }

            #toggle-btn:hover {
                color: var(--accent);
            }

            /* ===== Nav List ===== */
            #nav-list {
                list-style: none;
                padding: 8px 0;
                margin: 0;
                overflow-y: auto;
                flex-grow: 1;
            }

            .nav-item {
                padding: 12px 24px;
                cursor: pointer;
                font-size: 1rem;
                white-space: nowrap;
                color: var(--text-primary);
                letter-spacing: 0.5px;
            }

            .nav-item.active {
                color: var(--accent);
                font-weight: 600;
            }

            /* ===== Main ===== */
            #main {
                flex: 1;
                padding: 40px 64px;
                overflow-y: auto;
                scroll-behavior: auto;
                position: relative;
            }

            #meta {
                font-size: 0.8rem;
                color: var(--text-secondary);
                padding-bottom: 12px;
                margin-bottom: 0;
                letter-spacing: 1px;
                display: flex;
                justify-content: space-between;
            }

            /* ===== Progress Bar ===== */
            #progress-track {
                width: 100%;
                height: 2px;
                background: var(--line);
                margin-bottom: 32px;
                position: relative;
            }

            #progress-bar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: var(--accent);
                transition: width 0.1s linear, background 0.35s ease;
            }

            /* ===== Content ===== */
            #content {
                max-width: 800px;
                font-size: 1.15rem;
                line-height: 1.7;
                color: var(--text-primary);
            }

            #content h1, #content h2, #content h3 {
                color: var(--text-primary);
                margin: 1.6em 0 0.6em;
                font-weight: 600;
                letter-spacing: 0.5px;
            }

            #content h1 { font-size: 1.8rem; }
            #content h2 { font-size: 1.5rem; }
            #content h3 { font-size: 1.25rem; }

            #content p {
                margin: 0 0 1.2em;
            }

            #content a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
            }

            /* ===== Blockquote ===== */
            #content blockquote {
                margin: 1.2em 0;
                padding: 12px 20px;
                border-left: 4px solid var(--gold);
                background: var(--bg-card);
                color: var(--text-primary);
            }

            #content blockquote p {
                margin: 0;
            }

            /* ===== Code ===== */
            pre {
                background: var(--bg-card);
                padding: 16px 20px;
                border-left: 4px solid var(--gold);
                overflow-x: auto;
                margin: 1.2em 0;
                position: relative;
            }

            code {
                font-family: var(--code-font);
                color: var(--text-primary);
                font-size: 0.9em;
            }

            p code {
                background: var(--bg-card);
                padding: 2px 8px;
            }

            pre code {
                font-size: 0.9rem;
                line-height: 1.5;
            }

            /* ===== Lists ===== */
            #content ul, #content ol {
                margin: 0 0 1.2em;
                padding-left: 1.5em;
            }

            #content li {
                margin: 0.3em 0;
            }

            /* ===== Tables ===== */
            #content table {
                width: 100%;
                border-collapse: collapse;
                margin: 1.2em 0;
            }

            #content th, #content td {
                padding: 10px 14px;
                text-align: left;
                background: var(--bg-card);
            }

            #content th {
                font-weight: 600;
                color: var(--text-primary);
            }

            #content td {
                color: var(--text-primary);
            }

            /* ===== Horizontal Rule ===== */
            #content hr {
                border: none;
                height: 1px;
                background: var(--line);
                margin: 1.5em 0;
            }

            /* ===== Home View ===== */
            .home {
                height: 60vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }

            .home-time {
                font-size: 4.5rem;
                letter-spacing: 4px;
                color: var(--accent);
                font-weight: 300;
            }

            .home-date {
                font-size: 1.1rem;
                color: var(--text-secondary);
                margin-top: 8px;
                letter-spacing: 1px;
            }

            /* ===== Typing Cursor ===== */
            .typing::after {
                content: "▊";
                margin-left: 4px;
                color: var(--accent);
                animation: blink 0.8s infinite;
            }

            @keyframes blink {
                50% { opacity: 0; }
            }

            /* ===== Scrollbar ===== */
            ::-webkit-scrollbar {
                width: 4px;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--line);
            }
        </style>
    </head>

    <body>
        <div id="app">
            <aside id="sidebar">
                <div id="home-btn" onclick="showHome()">
                    <span>HOME</span>
                </div>
                <div id="theme-btn" onclick="toggleTheme()">
                    <span id="theme-text">暗色</span>
                </div>
                <div id="toggle-btn" onclick="toggleSidebar()">
                    <span>[ 目录 ]</span>
                </div>
                <ul id="nav-list">
                    <li class="nav-item">Loading index...</li>
                </ul>
            </aside>

            <main id="main">
                <div id="meta">
                    <span id="meta-info">SYSTEM READY</span>
                    <span id="meta-file"></span>
                </div>

                <div id="progress-track">
                    <div id="progress-bar"></div>
                </div>

                <article id="content"></article>
            </main>
        </div>

        <script>
            const content = document.getElementById("content");
            const metaInfo = document.getElementById("meta-info");
            const metaFile = document.getElementById("meta-file");
            const progressBar = document.getElementById("progress-bar");
            const themeText = document.getElementById("theme-text");

            let collapsed = false;
            let clockTimer = null;
            let typingTimer = null;
            let isTyping = false;

            /* ===== Theme ===== */
            function toggleTheme() {
                const html = document.documentElement;
                const current = html.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                html.setAttribute("data-theme", next);
                themeText.innerText = next === "light" ? "暗色" : "亮色";
                try {
                    localStorage.setItem("rumia-theme", next);
                } catch (e) {}
            }

            function initTheme() {
                try {
                    const saved = localStorage.getItem("rumia-theme");
                    if (saved === "dark") {
                        document.documentElement.setAttribute("data-theme", "dark");
                        themeText.innerText = "亮色";
                    }
                } catch (e) {}
            }

            /* ===== Sidebar ===== */
            function toggleSidebar() {
                const sb = document.getElementById("sidebar");
                const btnText = document.querySelector("#toggle-btn span");
                collapsed = !collapsed;
                sb.classList.toggle("collapsed", collapsed);
                btnText.innerText = collapsed ? ">" : "[ 目录 ]";
            }

            /* ===== Home ===== */
            function showHome() {
                stopTyping();
                clearActiveStatus();
                clearInterval(clockTimer);

                content.classList.remove("typing");
                metaInfo.innerText = "SYSTEM IDLE";
                metaFile.innerText = "";
                progressBar.style.width = "0%";

                content.innerHTML = `
        <div class="home">
            <div class="home-time" id="clock">--:--:--</div>
            <div class="home-date" id="date"></div>
        </div>`;

                updateClock();
                clockTimer = setInterval(updateClock, 1000);
            }

            function updateClock() {
                const clockEl = document.getElementById("clock");
                if (!clockEl) return;
                const n = new Date();
                clockEl.innerText = n.toLocaleTimeString("en-GB");
                document.getElementById("date").innerText = n.toDateString();
            }

            /* ===== Load Index ===== */
            async function loadIndex() {
                try {
                    const r = await fetch("index.json");
                    const list = await r.json();
                    const nav = document.getElementById("nav-list");
                    nav.innerHTML = "";

                    list.forEach((a, index) => {
                        const li = document.createElement("li");
                        li.className = "nav-item";
                        li.id = "nav-item-" + index;
                        li.innerText = "> " + a.title;
                        li.onclick = () => {
                            clearActiveStatus();
                            li.classList.add("active");
                            loadArticle(a);
                        };
                        nav.appendChild(li);
                    });
                } catch (e) {
                    document.getElementById("nav-list").innerHTML =
                        "<li class='nav-item'>INDEX LOAD ERROR</li>";
                }
            }

            function clearActiveStatus() {
                document
                    .querySelectorAll(".nav-item")
                    .forEach((el) => el.classList.remove("active"));
            }

            /* ===== Load Article ===== */
            async function loadArticle(a) {
                stopTyping();
                clearInterval(clockTimer);

                document.getElementById("main").scrollTop = 0;
                progressBar.style.width = "0%";

                metaInfo.innerText = `AUTH: ${a.author} | DATE: ${a.date}`;
                metaFile.innerText = `FILE: ${a.path}`;

                content.innerHTML = "";

                try {
                    const r = await fetch(a.path);
                    const md = await r.text();
                    const html = marked.parse(md);
                    typeHTML(html);
                } catch {
                    content.innerText = "FILE NOT FOUND: " + a.path;
                    content.classList.remove("typing");
                }
            }

            function stopTyping() {
                isTyping = false;
                if (typingTimer) {
                    clearInterval(typingTimer);
                    typingTimer = null;
                }
            }

            /* ===== Typewriter ===== */
            async function typeHTML(html) {
                isTyping = true;
                content.classList.add("typing");

                const temp = document.createElement("div");
                temp.innerHTML = html;
                const nodes = Array.from(temp.childNodes);
                const totalNodes = nodes.length;

                for (let i = 0; i < nodes.length; i++) {
                    if (!isTyping) break;

                    const node = nodes[i];
                    const progress = ((i + 1) / totalNodes) * 100;
                    progressBar.style.width = progress + "%";

                    const container = node.cloneNode(false);
                    content.appendChild(container);

                    if (node.nodeType === Node.TEXT_NODE) {
                        await typeText(node.textContent, container);
                    } else {
                        container.innerHTML = node.innerHTML;

                        if (window.renderMathInElement) {
                            renderMathInElement(container, {
                                delimiters: [
                                    { left: "$$", right: "$$", display: true },
                                    { left: "$", right: "$", display: false },
                                ],
                                throwOnError: false,
                            });
                        }

                        handleCodeLabels(container);
                        await new Promise((r) => setTimeout(r, 80));
                    }
                }

                content.classList.remove("typing");
                isTyping = false;
            }

            function typeText(text, target) {
                return new Promise((resolve) => {
                    let i = 0;
                    const interval = setInterval(() => {
                        if (!isTyping) {
                            clearInterval(interval);
                            resolve();
                            return;
                        }

                        target.textContent += text[i++];

                        if (i >= text.length) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 5);
                });
            }

            function handleCodeLabels(container) {
                const codeBlocks = container.querySelectorAll("pre code");
                codeBlocks.forEach((code) => {
                    const className = code.className;
                    if (className.startsWith("language-")) {
                        const lang = className
                            .replace("language-", "")
                            .toUpperCase();
                        const label = document.createElement("div");
                        label.innerText = lang;
                        Object.assign(label.style, {
                            position: "absolute",
                            top: "6px",
                            right: "12px",
                            fontSize: "0.75rem",
                            color: "var(--text-secondary)",
                            letterSpacing: "1px",
                        });
                        code.parentElement.style.position = "relative";
                        code.parentElement.appendChild(label);
                    }
                });
            }

            /* ===== Init ===== */
            initTheme();
            showHome();
            loadIndex();
        </script>
    </body>
</html>
