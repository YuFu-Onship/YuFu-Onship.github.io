<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Material Blog</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        ></script>

        <style>
            /* ===== Material Design 2 颜色系统 ===== */
            :root {
                /* 亮色模式 */
                --primary: #1976d2;
                --primary-variant: #1565c0;
                --secondary: #03dac6;
                --background: #ffffff;
                --surface: #ffffff;
                --error: #b00020;
                --on-primary: #ffffff;
                --on-secondary: #000000;
                --on-background: #000000;
                --on-surface: #000000;
                --on-error: #ffffff;

                /* 文本颜色 */
                --text-primary: rgba(0, 0, 0, 0.87);
                --text-secondary: rgba(0, 0, 0, 0.54);
                --text-disabled: rgba(0, 0, 0, 0.38);

                /* 边框和分割线 */
                --divider: rgba(0, 0, 0, 0.12);
                --border: rgba(0, 0, 0, 0.23);

                /* 字体 */
                --ui-font:
                    "Roboto", "PingFang SC", "Microsoft YaHei", sans-serif;
                --code-font:
                    "Roboto Mono", "JetBrains Mono", "Consolas", monospace;
            }

            /* 暗色模式 */
            [data-theme="dark"] {
                --primary: #bb86fc;
                --primary-variant: #3700b3;
                --secondary: #03dac6;
                --background: #121212;
                --surface: #1e1e1e;
                --error: #cf6679;
                --on-primary: #000000;
                --on-secondary: #000000;
                --on-background: #ffffff;
                --on-surface: #ffffff;
                --on-error: #000000;

                --text-primary: rgba(255, 255, 255, 0.87);
                --text-secondary: rgba(255, 255, 255, 0.54);
                --text-disabled: rgba(255, 255, 255, 0.38);

                --divider: rgba(255, 255, 255, 0.12);
                --border: rgba(255, 255, 255, 0.23);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                background: var(--background);
                color: var(--text-primary);
                font-family: var(--ui-font);
                overflow: hidden;
                transition:
                    background 0.3s,
                    color 0.3s;
            }

            /* ===== Layout ===== */
            #app {
                display: flex;
                height: 100vh;
                position: relative;
            }

            /* ===== 悬浮按钮容器（左上角固定） ===== */
            #fab-container {
                position: fixed;
                top: 16px;
                left: 16px;
                z-index: 1000;
                display: flex;
                gap: 8px;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            #sidebar:not(.collapsed) #fab-container {
                left: 296px;
            }

            /* ===== 悬浮按钮基础样式 ===== */
            .fab {
                min-width: 48px;
                height: 48px;
                border: none;
                background: var(--primary);
                color: var(--on-primary);
                cursor: pointer;
                border-radius: 4px;
                font-size: 20px;
                font-weight: 500;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 0 16px;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                white-space: nowrap;
            }

            .fab:hover {
                opacity: 0.9;
                transform: translateY(-1px);
            }

            .fab:active {
                transform: translateY(0);
            }

            /* ===== 侧边栏 ===== */
            #sidebar {
                width: 280px;
                min-width: 280px;
                background: var(--background);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 999;
            }

            #sidebar.collapsed {
                width: 0;
                min-width: 0;
                overflow: hidden;
            }

            /* ===== 侧边栏内容 ===== */
            #sidebar-content {
                padding: 80px 16px 16px;
                overflow-y: auto;
                height: 100%;
            }

            /* ===== Nav List - 悬浮按钮列表 ===== */
            #nav-list {
                list-style: none;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .nav-item {
                width: 100%;
                min-width: auto;
                height: auto;
                min-height: 48px;
                border: none;
                background: var(--surface);
                color: var(--text-primary);
                cursor: pointer;
                border-radius: 4px;
                font-size: 14px;
                font-weight: 500;
                display: flex;
                align-items: center;
                padding: 12px 16px;
                transition: all 0.2s;
                text-align: left;
                letter-spacing: 0.25px;
                border: 1px solid var(--divider);
            }

            .nav-item:hover {
                background: var(--divider);
                transform: translateX(4px);
            }

            .nav-item.active {
                background: var(--primary);
                color: var(--on-primary);
                border-color: var(--primary);
            }

            /* ===== Main Content ===== */
            #main {
                flex: 1;
                padding: 32px 48px;
                padding-top: 80px;
                overflow-y: auto;
                scroll-behavior: auto;
                background: var(--background);
                transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            #sidebar:not(.collapsed) ~ #main {
                margin-left: 280px;
            }

            #meta {
                font-size: 12px;
                letter-spacing: 0.4px;
                color: var(--text-secondary);
                padding-bottom: 16px;
                margin-bottom: 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            /* ===== Progress Bar ===== */
            #progress-track {
                width: 100%;
                height: 2px;
                background: var(--divider);
                margin-bottom: 32px;
            }

            #progress-bar {
                height: 100%;
                width: 0%;
                background: var(--primary);
                transition: width 0.2s linear;
            }

            #content {
                max-width: 820px;
                font-size: 16px;
                line-height: 1.6;
                color: var(--text-primary);
            }

            /* ===== Home View ===== */
            .home {
                height: 60vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                gap: 16px;
            }

            .home-time {
                font-size: 56px;
                font-weight: 300;
                letter-spacing: 2px;
                color: var(--primary);
            }

            .home-date {
                font-size: 16px;
                color: var(--text-secondary);
                letter-spacing: 1px;
            }

            /* ===== Markdown Elements ===== */
            #content h1,
            #content h2,
            #content h3 {
                color: var(--text-primary);
                margin: 1.5em 0 0.8em;
                font-weight: 400;
            }

            #content h1 {
                font-size: 32px;
                letter-spacing: -0.5px;
            }

            #content h2 {
                font-size: 24px;
                letter-spacing: -0.25px;
            }

            #content h3 {
                font-size: 20px;
            }

            #content p {
                margin: 1em 0;
            }

            #content a {
                color: var(--primary);
                text-decoration: none;
                border-bottom: 1px solid var(--primary);
            }

            #content a:hover {
                opacity: 0.8;
            }

            pre {
                background: var(--surface);
                padding: 16px;
                border-radius: 4px;
                border: 1px solid var(--divider);
                overflow-x: auto;
                margin: 1em 0;
            }

            code {
                font-family: var(--code-font);
                font-size: 14px;
            }

            p code {
                background: var(--divider);
                padding: 2px 6px;
                border-radius: 2px;
                color: var(--primary);
            }

            #content blockquote {
                border-left: 4px solid var(--primary);
                padding-left: 16px;
                margin: 1em 0;
                color: var(--text-secondary);
                font-style: italic;
            }

            #content ul,
            #content ol {
                padding-left: 32px;
                margin: 1em 0;
            }

            #content li {
                margin: 0.5em 0;
            }

            /* ===== Scrollbar ===== */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: var(--divider);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--text-secondary);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--text-primary);
            }

            /* ===== Code Label ===== */
            .code-label {
                position: absolute;
                top: 8px;
                right: 12px;
                font-size: 12px;
                color: var(--text-secondary);
                font-weight: 500;
                letter-spacing: 1px;
            }

            pre {
                position: relative;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <!-- 悬浮按钮容器 -->
            <div id="fab-container">
                <button
                    class="fab"
                    id="toggle-fab"
                    onclick="toggleSidebar()"
                    title="切换侧边栏"
                >
                    <span id="toggle-icon">☰</span>
                </button>
                <button
                    class="fab"
                    id="theme-fab"
                    onclick="toggleTheme()"
                    title="切换主题"
                >
                    <span id="theme-icon">☀️</span>
                </button>
            </div>

            <!-- 侧边栏 -->
            <aside id="sidebar" class="collapsed">
                <div id="sidebar-content">
                    <ul id="nav-list">
                        <li class="nav-item">Loading...</li>
                    </ul>
                </div>
            </aside>

            <!-- 主内容 -->
            <main id="main">
                <div id="meta">
                    <span id="meta-info">READY</span>
                    <span id="meta-file"></span>
                </div>

                <div id="progress-track">
                    <div id="progress-bar"></div>
                </div>

                <article id="content"></article>
            </main>
        </div>

        <script>
            const content = document.getElementById("content");
            const metaInfo = document.getElementById("meta-info");
            const metaFile = document.getElementById("meta-file");
            const progressBar = document.getElementById("progress-bar");
            const themeIcon = document.getElementById("theme-icon");
            const toggleIcon = document.getElementById("toggle-icon");

            let collapsed = true;
            let clockTimer = null;
            let currentTheme = "light";

            /* ===== 主题切换 ===== */
            function toggleTheme() {
                currentTheme = currentTheme === "light" ? "dark" : "light";
                document.documentElement.setAttribute(
                    "data-theme",
                    currentTheme,
                );
                themeIcon.textContent = currentTheme === "light" ? "☀️" : "🌙";
                localStorage.setItem("theme", currentTheme);
            }

            // 加载保存的主题
            function loadTheme() {
                const saved = localStorage.getItem("theme");
                if (saved) {
                    currentTheme = saved;
                    document.documentElement.setAttribute(
                        "data-theme",
                        currentTheme,
                    );
                    themeIcon.textContent =
                        currentTheme === "light" ? "☀️" : "🌙";
                }
            }

            /* ===== 侧边栏折叠 ===== */
            function toggleSidebar() {
                const sb = document.getElementById("sidebar");
                collapsed = !collapsed;
                sb.classList.toggle("collapsed", collapsed);
                toggleIcon.textContent = collapsed ? "☰" : "✕";
            }

            /* ===== 主页显示 ===== */
            function showHome() {
                clearActiveStatus();
                clearInterval(clockTimer);

                metaInfo.innerText = "IDLE";
                metaFile.innerText = "";
                progressBar.style.width = "0%";

                content.innerHTML = `
                <div class="home">
                    <div class="home-time" id="clock">--:--:--</div>
                    <div class="home-date" id="date"></div>
                </div>`;

                updateClock();
                clockTimer = setInterval(updateClock, 1000);
            }

            function updateClock() {
                const clockEl = document.getElementById("clock");
                if (!clockEl) return;
                const n = new Date();
                clockEl.innerText = n.toLocaleTimeString("en-GB");
                document.getElementById("date").innerText = n.toDateString();
            }

            /* ===== 加载索引 ===== */
            async function loadIndex() {
                try {
                    const r = await fetch("index.json");
                    const list = await r.json();
                    const nav = document.getElementById("nav-list");
                    nav.innerHTML = "";

                    list.forEach((a, index) => {
                        const li = document.createElement("li");
                        li.className = "nav-item";
                        li.id = "nav-item-" + index;
                        li.innerText = a.title;
                        li.onclick = () => {
                            clearActiveStatus();
                            li.classList.add("active");
                            loadArticle(a);
                        };
                        nav.appendChild(li);
                    });
                } catch (e) {
                    document.getElementById("nav-list").innerHTML =
                        "<li class='nav-item'>LOAD ERROR</li>";
                }
            }

            function clearActiveStatus() {
                document
                    .querySelectorAll(".nav-item")
                    .forEach((el) => el.classList.remove("active"));
            }

            /* ===== 加载文章内容 ===== */
            async function loadArticle(a) {
                clearInterval(clockTimer);

                // 重置滚动条到顶部
                document.getElementById("main").scrollTop = 0;

                // 重置进度条
                progressBar.style.width = "0%";

                metaInfo.innerText = `${a.author} | ${a.date}`;
                metaFile.innerText = a.path;

                content.innerHTML = "";

                try {
                    const r = await fetch(a.path);
                    const md = await r.text();
                    const html = marked.parse(md);
                    displayHTML(html);
                } catch {
                    content.innerText = "FILE NOT FOUND: " + a.path;
                }
            }

            /* ===== 显示HTML内容 ===== */
            function displayHTML(html) {
                content.innerHTML = html;

                // LaTeX 渲染
                if (window.renderMathInElement) {
                    renderMathInElement(content, {
                        delimiters: [
                            { left: "$$", right: "$$", display: true },
                            { left: "$", right: "$", display: false },
                        ],
                        throwOnError: false,
                    });
                }

                // 代码块高亮标签
                handleCodeLabels();

                // 设置进度条为100%
                progressBar.style.width = "100%";
            }

            // 代码块标签处理
            function handleCodeLabels() {
                const codeBlocks = content.querySelectorAll("pre code");
                codeBlocks.forEach((code) => {
                    const className = code.className;
                    if (className.startsWith("language-")) {
                        const lang = className
                            .replace("language-", "")
                            .toUpperCase();
                        const label = document.createElement("div");
                        label.className = "code-label";
                        label.innerText = lang;
                        code.parentElement.appendChild(label);
                    }
                });
            }

            /* ===== 初始化 ===== */
            loadTheme();
            showHome();
            loadIndex();
        </script>
    </body>
</html>
